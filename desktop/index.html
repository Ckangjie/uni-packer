<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>uni-app 离线打包工作台</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background-color: #0d1117;
        overflow: hidden;
      }
      #app-skeleton {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
        background-color: #0d1117;
        color: #94a3b8;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        user-select: none;
      }
      .skeleton-icon {
        font-size: 38px;
        margin-bottom: 12px;
        animation: pulse 1.2s ease-in-out infinite alternate;
      }
      .skeleton-title {
        font-size: 15px;
        font-weight: 600;
        color: #f1f5f9;
        margin-bottom: 6px;
      }
      .skeleton-sub {
        font-size: 12px;
        color: #64748b;
      }
      @keyframes pulse {
        from { transform: scale(0.96); opacity: 0.8; }
        to { transform: scale(1.04); opacity: 1; }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="app-skeleton">
        <div class="skeleton-icon">📦</div>
        <div class="skeleton-title">uni-app 离线打包工作台</div>
        <div class="skeleton-sub">正在加载界面组件...</div>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
